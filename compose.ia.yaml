# Usar junto de compose.yaml. Preserva as portas e configuracoes da sua maquina.
services:
  api:
    volumes:
      - ./artifacts/models:/app/models:ro
    environment:
      MODEL_PATH: /app/models/praga-v2.onnx

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      STORAGE_DIR: /app/storage
      MODEL_PATH: /app/models/praga-v2.onnx
    volumes:
      - ./storage:/app/storage:ro
      - ./artifacts/models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
